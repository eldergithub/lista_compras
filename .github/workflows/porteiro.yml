# Publica o porteiro (worker/nalista-ia.js) na Cloudflare sozinho, sempre que
# ele muda na main. Ninguém precisa mais copiar e colar o código no painel.
#
# Precisa de dois segredos no repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token da Cloudflare com o modelo "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  o ID da conta, que aparece no painel da Cloudflare
# Os segredos do próprio porteiro (OPENROUTER_KEY, CODIGO_FAMILIA) continuam na Cloudflare.

name: Publicar o porteiro na Cloudflare

on:
  push:
    branches: [main]
    paths: ['worker/**']
  # Permite publicar na mão pela aba "Actions" do repositório.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: porteiro
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      TEM_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o código do porteiro
        run: node --check worker/nalista-ia.js
      # Sem os segredos ainda configurados, só pula (sem erro).
      - name: Avisar que falta configurar
        if: env.TEM_TOKEN != 'true'
        run: echo "::notice::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID; o porteiro não foi publicado."
      - name: Publicar na Cloudflare
        if: env.TEM_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
