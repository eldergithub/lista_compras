<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f3f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
  <script>
    // Tema escolhido no app (claro ou escuro), antes de pintar a tela: sem piscar.
    try { var t = localStorage.getItem('nalista-tema'); if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t; } catch (e) {}
  </script>
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NaLista">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Monte a lista, mande pelo WhatsApp e marque item por item, no mercado, na farmácia ou onde for. Funciona sem internet.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NaLista">
  <meta property="og:title" content="Chegou uma lista para você">
  <meta property="og:description" content="Toque para abrir a lista no NaLista e ir marcando.">
  <meta property="og:image" content="https://eldergithub.github.io/lista_compras/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>NaLista</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-180-v2.png">
</head>
<body>
  <div class="app">
    <header>
      <div class="topo">
        <img class="logo" src="/icons/icon.svg" alt="NaLista" width="34" height="34">
        <div class="titulo">
          <span class="marca-pequena"><span class="na">Na</span>Lista</span>
          <h1 id="tituloLista">Lista</h1>
        </div>
        <span id="contagem"></span>
      </div>
      <div class="barra"><span id="barra"></span></div>
      <button class="gasto" id="gasto" type="button" hidden></button>
      <div class="barra-add" id="barraAdd">
        <form class="entrada" id="fNovo" autocomplete="off">
          <input class="texto" id="nTexto" placeholder="Adicionar item…" enterkeyhint="enter" autocapitalize="sentences" aria-label="Adicionar item">
          <button class="redondo" id="nMic" type="button" aria-label="Falar os itens"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button class="redondo" id="nEscolher" type="button" aria-label="Escolher itens: listas prontas e categorias"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
          <button class="redondo cheio" id="nEnviar" type="submit" aria-label="Adicionar item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </form>
        <div class="sobe" id="sobe" hidden>
          <ul class="previa" id="nPrevia" hidden></ul>
          <div class="chips rolar" id="nSug" aria-label="Sugestões"></div>
        </div>
      </div>
      <div class="faixa" id="faixa" hidden></div>
    </header>
    <main id="lista"></main>
    <div class="tudo" id="tudo"></div>
    <button class="limpar" id="limpar" type="button"></button>
  </div>
  <nav class="abas-baixo" aria-label="Menu principal">
    <button class="aba-baixo" id="bListas" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg><span>Listas</span><b class="selo-abas" id="nListas" hidden></b></button>
    <button class="aba-baixo" id="bCompras" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Compras</span></button>
    <button class="aba-baixo" id="bEnviar" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"/></svg><span>Enviar</span></button>
    <button class="aba-baixo" id="bImportar" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><span>Importar</span></button>
    <button class="aba-baixo" id="bMais" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Ajustes</span></button>
  </nav>
  <div class="fundo" id="fundo"><div class="painel" id="painel" role="dialog" aria-modal="true"></div></div>
  <div class="aviso" id="aviso" role="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
